name: OctoFit CI/CD

on:
  pull_request:
    paths:
      - "octofit-tracker/**"
      - ".github/workflows/octofit-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "octofit-tracker/**"
      - ".github/workflows/octofit-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            octofit-tracker/backend/package-lock.json
            octofit-tracker/frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix octofit-tracker/backend
          npm ci --prefix octofit-tracker/frontend
      - name: Test backend compilation
        run: npm run build --prefix octofit-tracker/backend
      - name: Test frontend
        run: |
          npm run lint --prefix octofit-tracker/frontend
          npm run build --prefix octofit-tracker/frontend

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/octofit-backend
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: octofit-tracker/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}